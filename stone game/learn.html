<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissor</title>
    <link rel="stylesheet" href="./learn.css">
</head>
<body>
    <main>
        <div class="heading"><h1>Stone Paper Scissor</h1></div>
            <div class="choices">
                <div class="choice" id="stone"><img src="./images/stone.jpeg" alt="stone"></div>
                <div class="choice" id="paper"><img src="./images/paper.jpeg" alt="paper"></div>   
                <div class="choice" id="scissor"><img src="./images/scissor.jpeg" alt="scissor"></div>
            </div> 
            <div class="counter-score">
                <div class="score">
                    <p id="user-score">0</p>
                    <p>You</p>
                </div>
                <div class="score">
                    <p id="comp-score">0</p>
                    <p>comp</p>
                </div>
            </div>
            <div class="msg-container" >
                <p id="msg">Pick Your Move</p>
            </div>
    </main>
    <script src="learn.js"></script>
</body>
</html>
